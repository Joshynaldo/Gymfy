name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.0.1). Leave empty to use the version from pubspec.yaml"
        required: false
        type: string
      release_notes:
        description: "Release notes (optional)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gymfy

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Determine release version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="v$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/gymfy-${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Gymfy ${{ steps.version.outputs.version }}"
          body: ${{ inputs.release_notes }}
          prerelease: ${{ inputs.prerelease }}
          files: gymfy/release/gymfy-${{ steps.version.outputs.version }}.apk
