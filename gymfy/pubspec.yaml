name: gymfy
description: "Track your lifts, your splits, and your progress."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.3.0
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  freezed_annotation: ^3.1.0
  flutter_svg: ^2.3.0
  fl_chart: ^1.2.0
  # Progress photos: pick from the gallery, then copy into the app's own
  # documents directory so the photo survives the original being deleted.
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  # Saving a plan out and picking one back in. Handles both directions, so
  # there is no separate share plugin.
  #
  # Must be >= 12: version 11 hardcodes Kotlin Gradle Plugin 1.8.22, which
  # Gradle 9 refuses to run, so its Kotlin never compiles and `FilePickerPlugin`
  # goes missing at Java link time.
  #
  # `share_plus` was tried here and removed. It cannot coexist with this:
  # file_picker 12 needs win32 ^6 and every share_plus below 13 pins win32 ^5,
  # while share_plus 13.3 fails to compile its own Kotlin against AGP 9
  # (`Unresolved reference 'SharePlusPendingIntent'`). `saveFile` covers export
  # on its own, and PDFs go out through `printing`'s system sheet.
  file_picker: ^12.0.0
  # Printing a plan. `pdf` builds the document, `printing` shows the system
  # print/share sheet for it.
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  drift_dev: ^2.34.0
  freezed: ^3.2.6-dev.1
  # Build-time only: both generate files under android/ and ship no code in the
  # APK. Source artwork is produced by `dart run tool/generate_icon.dart`.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# Launcher icon. Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  # iOS isn't a target for this app, so nothing is generated for it.
  ios: false
  image_path: assets/icon/gymfy_icon.png
  # Adaptive icon (Android 8+): the launcher masks the foreground to whatever
  # shape the device uses, over this flat background. Background is the same
  # dark surface the app's theme uses, so the icon matches the app it opens.
  adaptive_icon_background: "#151821"
  adaptive_icon_foreground: assets/icon/gymfy_icon_foreground.png
  # Themed icons (Android 13+): the launcher recolours this to the user's
  # wallpaper palette. The foreground is a flat silhouette already, so it works
  # as-is — without this the system falls back to a washed-out auto-conversion.
  adaptive_icon_monochrome: assets/icon/gymfy_icon_foreground.png
  min_sdk_android: 24

# Splash screen. Regenerate with: dart run flutter_native_splash:create
#
# Dark in both system themes on purpose: the app itself is dark-mode-first, so a
# white splash would flash bright and then drop into a dark app.
flutter_native_splash:
  android: true
  ios: false
  web: false
  color: "#151821"
  color_dark: "#151821"
  image: assets/icon/gymfy_splash.png
  image_dark: assets/icon/gymfy_splash.png
  # Android 12+ draws its own splash and ignores the settings above, so it needs
  # its own correctly-sized image (1152px, mark inside a 768px circle).
  android_12:
    color: "#151821"
    color_dark: "#151821"
    image: assets/icon/gymfy_splash_android12.png
    image_dark: assets/icon/gymfy_splash_android12.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Exercise GIF previews live here, one file per exercise (named <id>.gif).
  # The folder is bundled even while empty; missing GIFs fall back to a
  # placeholder in the exercise detail screen.
  assets:
    - assets/exercises/
    # Muscle-map body diagrams (front + back). Paths are tagged per muscle.
    - assets/svg/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
