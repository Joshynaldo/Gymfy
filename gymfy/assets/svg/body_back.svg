<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 470" width="220" height="470">
  <!--
    Anatomical back-of-body muscle map. Same conventions as body_front.svg:
    each muscle is a group tagged with a data-muscle attribute matching
    MuscleId; the right-side path is drawn once and mirrored across x=110 with
    matrix(-1 0 0 1 220 0); neutral parts are untagged; the group fill is a
    runtime-rewritten placeholder.
  -->

  <!-- Neutral body base + connectors -->
  <g fill="#2C313C">
    <circle cx="110" cy="34" r="22"/>
    <rect x="100" y="50" width="20" height="20" rx="6"/>
    <path d="M78 80 C74 122 84 182 90 200 L130 200 C136 182 146 122 142 80 C120 72 100 72 78 80 Z"/>
    <path d="M88 198 C84 216 86 232 96 240 L124 240 C134 232 136 216 132 198 Z"/>
    <circle cx="68" cy="90" r="15"/>
    <circle cx="152" cy="90" r="15"/>
    <rect x="50" y="100" width="22" height="62" rx="11"/>
    <rect x="148" y="100" width="22" height="62" rx="11"/>
    <rect x="46" y="160" width="20" height="54" rx="9"/>
    <rect x="154" y="160" width="20" height="54" rx="9"/>
    <circle cx="56" cy="220" r="9"/>
    <circle cx="164" cy="220" r="9"/>
    <rect x="80" y="234" width="28" height="90" rx="14"/>
    <rect x="112" y="234" width="28" height="90" rx="14"/>
    <circle cx="96" cy="324" r="10"/>
    <circle cx="124" cy="324" r="10"/>
    <rect x="84" y="326" width="24" height="78" rx="11"/>
    <rect x="112" y="326" width="24" height="78" rx="11"/>
    <ellipse cx="96" cy="408" rx="13" ry="7"/>
    <ellipse cx="124" cy="408" rx="13" ry="7"/>
  </g>

  <!-- Muscles (right side drawn, then mirrored across x=110) -->
  <g data-muscle="neck" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M104 54 C103 62 101 68 98 72 L101 54 Z"/>
    <path d="M104 54 C103 62 101 68 98 72 L101 54 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="trapezius" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M110 60 C126 63 140 78 147 95 C141 108 128 117 120 120 L110 148 Z"/>
    <path d="M110 60 C126 63 140 78 147 95 C141 108 128 117 120 120 L110 148 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="rear_deltoid" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M80 86 C68 82 57 89 55 101 C56 112 67 117 77 111 C83 104 84 93 80 86 Z"/>
    <path d="M80 86 C68 82 57 89 55 101 C56 112 67 117 77 111 C83 104 84 93 80 86 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="side_deltoid" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M55 100 C49 102 46 110 48 119 C52 125 60 123 61 115 C61 108 60 102 55 100 Z"/>
    <path d="M55 100 C49 102 46 110 48 119 C52 125 60 123 61 115 C61 108 60 102 55 100 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="triceps" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M70 110 C60 114 56 130 58 150 C61 160 72 160 74 146 C76 130 76 116 70 110 Z"/>
    <path d="M70 110 C60 114 56 130 58 150 C61 160 72 160 74 146 C76 130 76 116 70 110 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="forearms" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M68 160 C58 168 53 186 55 204 C59 213 69 211 70 200 C72 184 74 170 68 160 Z"/>
    <path d="M68 160 C58 168 53 186 55 204 C59 213 69 211 70 200 C72 184 74 170 68 160 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="lats" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M82 108 C96 112 99 120 99 132 L97 176 C92 168 82 150 78 132 C76 120 78 112 82 108 Z"/>
    <path d="M82 108 C96 112 99 120 99 132 L97 176 C92 168 82 150 78 132 C76 120 78 112 82 108 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="lower_back" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M100 150 C98 166 98 182 101 194 L108 194 L108 150 Z"/>
    <path d="M100 150 C98 166 98 182 101 194 L108 194 L108 150 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="glutes" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M108 198 C96 197 86 204 84 216 C85 228 96 236 108 234 Z"/>
    <path d="M108 198 C96 197 86 204 84 216 C85 228 96 236 108 234 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="hamstrings" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M84 240 C79 264 81 300 93 318 C101 320 107 311 107 299 L107 244 C99 240 91 238 84 240 Z"/>
    <path d="M84 240 C79 264 81 300 93 318 C101 320 107 311 107 299 L107 244 C99 240 91 238 84 240 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="calves" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M87 330 C82 344 83 366 90 396 C98 400 106 392 105 372 C104 352 99 338 93 331 Z"/>
    <path d="M87 330 C82 344 83 366 90 396 C98 400 106 392 105 372 C104 352 99 338 93 331 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
</svg>
