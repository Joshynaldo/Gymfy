<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 470" width="220" height="470">
  <!--
    Anatomical front-of-body muscle map. Each muscle is a group tagged with a
    data-muscle attribute whose value matches MuscleId
    (lib/shared/models/muscle_ids.dart). Paired left/right shapes share one
    group: the right-side path is drawn once and mirrored across x=110 with
    matrix(-1 0 0 1 220 0). Neutral parts (head, joints, hands, feet) are
    untagged. The fill on each muscle group is a placeholder the muscle-map
    widget rewrites per-muscle at runtime.
  -->

  <!-- Neutral body base + connectors -->
  <g fill="#2C313C">
    <circle cx="110" cy="34" r="22"/>
    <rect x="100" y="50" width="20" height="20" rx="6"/>
    <path d="M78 80 C74 122 84 182 90 200 L130 200 C136 182 146 122 142 80 C120 72 100 72 78 80 Z"/>
    <path d="M88 198 C84 216 86 232 96 240 L124 240 C134 232 136 216 132 198 Z"/>
    <circle cx="68" cy="90" r="15"/>
    <circle cx="152" cy="90" r="15"/>
    <rect x="50" y="100" width="22" height="62" rx="11"/>
    <rect x="148" y="100" width="22" height="62" rx="11"/>
    <rect x="46" y="160" width="20" height="54" rx="9"/>
    <rect x="154" y="160" width="20" height="54" rx="9"/>
    <circle cx="56" cy="220" r="9"/>
    <circle cx="164" cy="220" r="9"/>
    <rect x="80" y="234" width="28" height="90" rx="14"/>
    <rect x="112" y="234" width="28" height="90" rx="14"/>
    <circle cx="96" cy="324" r="10"/>
    <circle cx="124" cy="324" r="10"/>
    <rect x="84" y="326" width="24" height="78" rx="11"/>
    <rect x="112" y="326" width="24" height="78" rx="11"/>
    <ellipse cx="96" cy="408" rx="13" ry="7"/>
    <ellipse cx="124" cy="408" rx="13" ry="7"/>
  </g>

  <!-- Muscles (right side drawn, then mirrored across x=110) -->
  <g data-muscle="neck" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M104 54 C103 62 101 68 98 72 L101 54 Z"/>
    <path d="M104 54 C103 62 101 68 98 72 L101 54 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="trapezius" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M101 72 C93 74 85 80 81 86 C91 82 99 79 104 78 Z"/>
    <path d="M101 72 C93 74 85 80 81 86 C91 82 99 79 104 78 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="front_deltoid" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M80 86 C68 82 57 89 55 101 C56 112 67 117 77 111 C83 104 84 93 80 86 Z"/>
    <path d="M80 86 C68 82 57 89 55 101 C56 112 67 117 77 111 C83 104 84 93 80 86 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="side_deltoid" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M55 100 C49 102 46 110 48 119 C52 125 60 123 61 115 C61 108 60 102 55 100 Z"/>
    <path d="M55 100 C49 102 46 110 48 119 C52 125 60 123 61 115 C61 108 60 102 55 100 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="chest" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M108 88 C98 83 87 84 81 93 C78 102 81 112 91 116 C100 118 108 111 108 102 Z"/>
    <path d="M108 88 C98 83 87 84 81 93 C78 102 81 112 91 116 C100 118 108 111 108 102 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="biceps" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M70 110 C60 114 56 128 58 146 C61 158 72 158 74 144 C76 128 76 116 70 110 Z"/>
    <path d="M70 110 C60 114 56 128 58 146 C61 158 72 158 74 144 C76 128 76 116 70 110 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="forearms" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M68 160 C58 168 53 186 55 204 C59 213 69 211 70 200 C72 184 74 170 68 160 Z"/>
    <path d="M68 160 C58 168 53 186 55 204 C59 213 69 211 70 200 C72 184 74 170 68 160 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="obliques" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M92 120 C86 138 86 162 92 184 L96 184 L96 120 Z"/>
    <path d="M92 120 C86 138 86 162 92 184 L96 184 L96 120 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="abs" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <rect x="98" y="120" width="11" height="19" rx="4"/>
    <rect x="111" y="120" width="11" height="19" rx="4"/>
    <rect x="98" y="142" width="11" height="19" rx="4"/>
    <rect x="111" y="142" width="11" height="19" rx="4"/>
    <rect x="98" y="164" width="11" height="24" rx="4"/>
    <rect x="111" y="164" width="11" height="24" rx="4"/>
  </g>
  <g data-muscle="quads" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M84 238 C79 262 81 298 93 316 C101 318 107 309 107 297 L107 242 C99 238 91 236 84 238 Z"/>
    <path d="M84 238 C79 262 81 298 93 316 C101 318 107 309 107 297 L107 242 C99 238 91 236 84 238 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="adductors" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M100 242 C96 258 97 282 102 298 L108 298 L108 242 Z"/>
    <path d="M100 242 C96 258 97 282 102 298 L108 298 L108 242 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
  <g data-muscle="calves" fill="#4C5361" stroke="#232833" stroke-width="1.2">
    <path d="M88 330 C83 350 85 380 93 396 C100 398 105 389 105 377 C105 356 99 340 93 332 Z"/>
    <path d="M88 330 C83 350 85 380 93 396 C100 398 105 389 105 377 C105 356 99 340 93 332 Z" transform="matrix(-1 0 0 1 220 0)"/>
  </g>
</svg>
